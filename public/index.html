<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Family Task App</title>

  <link
    rel="manifest"
    href="manifest.json"
  />

  <meta
    name="theme-color"
    content="#38bdf8"
  />

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      font-family: Arial, sans-serif;

      background: #020617;

      color: white;

    }






    /* AUTH */

    .container {

      max-width: 420px;

      margin: 60px auto;

    }

    .card {

      background: #0f172a;

      padding: 30px;

      border-radius: 24px;

      border: 1px solid #1e293b;

      margin-bottom: 20px;

    }

    input {

      width: 100%;

      padding: 14px;

      border: none;

      border-radius: 12px;

      margin-top: 12px;

      margin-bottom: 12px;

      font-size: 16px;

    }

    button {

      border: none;

      border-radius: 12px;

      padding: 14px;

      background: #22c55e;

      color: white;

      cursor: pointer;

      font-weight: bold;

      width: 100%;

      margin-top: 10px;

    }

    .secondaryBtn {

      background: #334155;

    }

    .hidden {

      display: none;

    }






    /* APP LAYOUT */

    #app {

      display: none;

      min-height: 100vh;

    }






    /* SIDEBAR */

    #sidebar {

      position: fixed;

      left: 0;

      top: 0;

      width: 280px;

      height: 100vh;

      background: #0f172a;

      border-right: 1px solid #1e293b;

      padding: 20px;

      overflow-y: auto;

    }






    #sidebar h1 {

      text-align: center;

      margin-bottom: 30px;

    }






    .menuItem {

      background: #111827;

      padding: 16px;

      border-radius: 14px;

      margin-bottom: 15px;

      cursor: pointer;

      font-size: 18px;

      font-weight: bold;

    }






    .dropdownContent {

      display: none;

      margin-top: 10px;

      background: #020617;

      border-radius: 12px;

      padding: 10px;

    }






    /* MAIN CONTENT */

    #mainContent {

      margin-left: 280px;

      padding: 30px;

    }






    .appCard {

      background: #0f172a;

      padding: 20px;

      border-radius: 20px;

      margin-bottom: 20px;

      border: 1px solid #1e293b;

    }






    /* CHAT */

    #chatToggle {

      position: fixed;

      bottom: 20px;

      right: 20px;

      width: 70px;

      height: 70px;

      border-radius: 50%;

      background: #22c55e;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 30px;

      cursor: pointer;

      z-index: 9999;

    }






    #chatWindow {

      position: fixed;

      bottom: 100px;

      right: 20px;

      width: 350px;

      height: 500px;

      background: #0f172a;

      border-radius: 20px;

      border: 1px solid #1e293b;

      display: none;

      flex-direction: column;

      overflow: hidden;

      z-index: 9999;

    }






    #chatMessages {

      flex: 1;

      overflow-y: auto;

      padding: 15px;

    }

  </style>

</head>

<body>





  <!-- AUTH -->

  <div
    id="auth"
    class="container"
  >

    <h1>🏠 Family Task App</h1>





    <!-- LOGIN -->

    <div
      id="loginBox"
      class="card"
    >

      <h2>Login</h2>

      <input
        id="loginUsername"
        placeholder="Username"
      />

      <input
        id="loginPassword"
        type="password"
        placeholder="Password"
      />

      <button onclick="login()">
        Login
      </button>

      <button
        class="secondaryBtn"
        onclick="showRegister()"
      >
        Not Registered?
      </button>

    </div>





    <!-- REGISTER -->

    <div
      id="registerBox"
      class="card hidden"
    >

      <h2>Create Account</h2>

      <input
        id="registerUsername"
        placeholder="Username"
      />

      <input
        id="registerEmail"
        type="email"
        placeholder="Email"
      />

      <input
        id="registerPassword"
        type="password"
        placeholder="Password"
      />

      <button onclick="register()">
        Register
      </button>

      <button
        class="secondaryBtn"
        onclick="showLogin()"
      >
        Back To Login
      </button>

    </div>

  </div>







  <!-- APP -->

  <div id="app">





    <!-- SIDEBAR -->

    <div id="sidebar">

      <h1 id="welcomeUser"></h1>

      <button onclick="logout()">
        Logout
      </button>





      <!-- USERS -->

      <div
        class="menuItem"
        onclick="toggleDropdown('usersDropdown')"
      >

        👨‍👩‍👧 Users

        <div
          id="usersDropdown"
          class="dropdownContent"
          onclick="event.stopPropagation()"
        >

          <div id="usersList"></div>

        </div>

      </div>





      <!-- REQUESTS -->

      <div
        class="menuItem"
        onclick="toggleDropdown('requestsDropdown')"
      >

        🔔 Requests

        <div
          id="requestsDropdown"
          class="dropdownContent"
          onclick="event.stopPropagation()"
        >

          <div id="notificationsList"></div>

        </div>

      </div>





      <!-- TASKS -->

      <div
        class="menuItem"
        onclick="toggleDropdown('tasksDropdown')"
      >

        📝 Tasks

        <div
          id="tasksDropdown"
          onclick="event.stopPropagation()"
          class="dropdownContent"
        >

          <input
            id="taskInput"
            placeholder="Add new task"
          />

          <button onclick="addTask()">
            Add Task
          </button>

          <div id="taskList"></div>

        </div>

      </div>

    </div>







    <!-- MAIN -->

    <div id="mainContent">

      <div class="appCard">

        <h1>📊 Daily Stats</h1>

        <div id="statsList"></div>

      </div>

    </div>

  </div>







  <!-- CHAT -->

  <div id="chatToggle">
    💬
  </div>





  <div id="chatWindow">

    <div
      style="
        background:#111827;
        padding:15px;
        display:flex;
        justify-content:space-between;
      "
    >

      Family Chat

      <span
        id="closeChat"
        style="cursor:pointer;"
      >
        ✖
      </span>

    </div>





    <div id="chatMessages"></div>





    <div
      style="
        padding:15px;
        border-top:1px solid #1e293b;
      "
    >

      <input
        id="chatInput"
        placeholder="Write message..."
      />

      <button onclick="sendMessage()">
        Send
      </button>

    </div>

  </div>







  <script>

    function showRegister() {

      document.getElementById("loginBox").classList.add("hidden");

      document.getElementById("registerBox").classList.remove("hidden");

    }



    function showLogin() {

      document.getElementById("registerBox").classList.add("hidden");

      document.getElementById("loginBox").classList.remove("hidden");

    }






    function toggleDropdown(id) {

      const element =
        document.getElementById(id);



      if (

        element.style.display === "block"

      ) {

        element.style.display = "none";

      }

      else {

        element.style.display = "block";

      }

    }






    document.addEventListener("DOMContentLoaded", function () {

      const chatToggle =
        document.getElementById("chatToggle");

      const chatWindow =
        document.getElementById("chatWindow");

      const closeChat =
        document.getElementById("closeChat");



      chatToggle.addEventListener("click", function () {

        chatWindow.style.display = "flex";

      });



      closeChat.addEventListener("click", function () {

        chatWindow.style.display = "none";

      });

    });

  </script>







  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    window.API_BASE = "/api";
  </script>

  <!-- JS -->

  <script
    type="module"
  ></script>

  <script
    type="module"
    src="./js/auth.js"
  ></script>

  <script
    type="module"
    src="./js/profiles.js"
  ></script>

  <script
    type="module"
    src="./js/requests.js"
  ></script>

  <script
    type="module"
    src="./js/tasks.js"
  ></script>

  <script
    type="module"
    src="./js/chat.js"
  ></script>

  <script
    type="module"
    src="./js/counters.js"
  ></script>

  <script
    type="module"
    src="./js/ui.js"
  ></script>

</body>

</html>
