<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Family Task App</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#55735A" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
/* ---------- tokens ---------- */
:root {
  --bg: #faf3e4;
  --surface: #ffffff;
  --surface-soft: #f3ecdb;
  --ink: #2e2a22;
  --ink-soft: #6b6354;
  --sage: #55735a;
  --sage-light: #e4ece0;
  --mustard: #d9a23b;
  --mustard-light: #f7e8c9;
  --brick: #b4593a;
  --brick-light: #f6e2d9;
  --line: rgba(46, 42, 34, 0.12);
  --shadow: 0 6px 20px rgba(46, 42, 34, 0.08);
  --radius: 14px;
  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'Inter', 'Segoe UI', Arial, sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--ink);
}

h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; }
p { margin: 0; }

.hidden { display: none; }

/* ---------- auth ---------- */
.container {
  max-width: 420px;
  margin: 64px auto;
  padding: 0 20px;
}

.brandMark {
  text-align: center;
  margin-bottom: 28px;
}

.brandIcon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 52px;
  height: 52px;
  border-radius: 16px;
  background: var(--sage-light);
  color: var(--sage);
  font-size: 26px;
  margin-bottom: 12px;
}

.brandMark h1 { font-size: 26px; color: var(--ink); }

.brandTag {
  font-size: 14px;
  color: var(--ink-soft);
  margin-top: 6px;
}

.card {
  background: var(--surface);
  padding: 28px;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  margin-bottom: 20px;
}

.card h2 { font-size: 20px; margin-bottom: 4px; }

input {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 10px;
  margin-top: 12px;
  font-size: 15px;
  font-family: var(--font-body);
  background: var(--surface);
  color: var(--ink);
}

input:focus {
  outline: none;
  border-color: var(--sage);
  box-shadow: 0 0 0 3px var(--sage-light);
}

button {
  border: none;
  border-radius: 10px;
  padding: 12px 16px;
  background: var(--sage);
  color: #fff;
  cursor: pointer;
  font-weight: 500;
  font-family: var(--font-body);
  font-size: 14px;
  width: 100%;
  margin-top: 12px;
  transition: transform 0.1s ease, background 0.15s ease;
}

button:hover { background: #486350; }
button:active { transform: scale(0.98); }

.secondaryBtn {
  background: transparent;
  color: var(--ink-soft);
  border: 1px solid var(--line);
}

.secondaryBtn:hover { background: var(--surface-soft); }

/* ---------- app layout ---------- */
#app {
  display: none;
  min-height: 100vh;
}

#sidebar {
  position: fixed;
  left: 0;
  top: 0;
  width: 260px;
  height: 100vh;
  background: var(--surface);
  border-right: 1px solid var(--line);
  padding: 24px 18px;
  overflow-y: auto;
}

.sidebarTop {
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--line);
}

.welcomeLabel {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 10px;
}

.logoutBtn {
  background: transparent;
  color: var(--ink-soft);
  border: 1px solid var(--line);
  margin-top: 0;
  padding: 8px 12px;
  font-size: 13px;
  width: auto;
}

.logoutBtn:hover { background: var(--surface-soft); }

.menu { display: flex; flex-direction: column; gap: 8px; }

.menuItem {
  position: relative;
  background: transparent;
  padding: 12px 14px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 15px;
  font-weight: 500;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 10px;
}

.menuItem:hover { background: var(--surface-soft); }

.menuIcon { font-size: 18px; line-height: 1; }

.dropdownContent {
  display: none;
  margin-top: 8px;
  background: var(--surface-soft);
  border-radius: 10px;
  padding: 12px;
  width: 100%;
}

.dropdownContent input { margin-top: 0; }

/* ---------- main content ---------- */
#mainContent {
  margin-left: 260px;
  padding: 32px 40px 60px;
}

.eyebrow {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--sage);
  margin-bottom: 4px;
}

.statsStrip h1 { font-size: 28px; margin-bottom: 20px; }

.statsGrid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
  margin-bottom: 32px;
}

.statsGrid h3 {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
}

.sectionHead { margin-bottom: 14px; }

.taskGrid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 16px;
}

/* ---------- task cards (JS-generated) ---------- */
.task {
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 4px solid var(--mustard);
  border-radius: var(--radius);
  padding: 18px 20px;
  box-shadow: var(--shadow);
}

.task:nth-child(3n+2) { border-left-color: var(--sage); }
.task:nth-child(3n) { border-left-color: var(--brick); }

.task h2 {
  font-size: 17px;
  margin-bottom: 10px;
  color: var(--ink);
}

.task p {
  font-size: 13px;
  color: var(--ink-soft);
  margin: 4px 0;
  line-height: 1.5;
}

.task.completed {
  opacity: 0.6;
}

.task h3 {
  font-size: 13px;
  color: var(--sage);
  margin-top: 10px;
}

.task .completeBtn {
  background: var(--sage);
  color: #fff;
  width: auto;
  padding: 8px 14px;
  font-size: 13px;
  margin-top: 12px;
}

.task .completeBtn:hover { background: #486350; }

/* ---------- users / requests / counters (JS-generated) ---------- */
.message {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px 14px;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--ink);
}

.message strong { font-weight: 600; }

.message .mainBtn {
  background: var(--mustard);
  color: var(--ink);
  width: auto;
  padding: 8px 14px;
  font-size: 13px;
  margin-top: 10px;
}

.message .mainBtn:hover { background: #c68f2f; }

/* ---------- chat ---------- */
#chatToggle {
  position: fixed;
  bottom: 24px;
  right: 24px;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: var(--sage);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  cursor: pointer;
  z-index: 999;
  box-shadow: var(--shadow);
}

#chatWindow {
  position: fixed;
  bottom: 96px;
  right: 24px;
  width: 340px;
  height: 460px;
  background: var(--surface);
  border-radius: var(--radius);
  border: 1px solid var(--line);
  display: none;
  flex-direction: column;
  overflow: hidden;
  z-index: 999;
  box-shadow: var(--shadow);
}

.chatHeader {
  background: var(--sage);
  color: #fff;
  padding: 14px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 500;
  font-size: 14px;
}

.chatClose { cursor: pointer; opacity: 0.85; }
.chatClose:hover { opacity: 1; }

#chatMessages {
  flex: 1;
  overflow-y: auto;
  padding: 14px;
  background: var(--surface-soft);
}

#chatMessages .message { background: var(--surface); }

.chatInputRow {
  display: flex;
  gap: 8px;
  padding: 12px;
  border-top: 1px solid var(--line);
}

.chatInputRow input { margin-top: 0; flex: 1; }
.chatInputRow button { width: auto; margin-top: 0; padding: 10px 16px; }

/* ---------- responsive ---------- */
@media (max-width: 768px) {
  #sidebar {
    position: static;
    width: 100%;
    height: auto;
    border-right: none;
    border-bottom: 1px solid var(--line);
  }

  #mainContent {
    margin-left: 0;
    padding: 24px 18px 60px;
  }

  #chatWindow {
    width: calc(100vw - 32px);
    right: 16px;
  }
}
  </style>
</head>

<body>

  <!-- AUTH -->
  <div id="auth" class="container">
    <div class="brandMark">
      <span class="brandIcon">&#8962;</span>
      <h1>Family Task App</h1>
      <p class="brandTag">Keep the household in sync</p>
    </div>

    <!-- LOGIN -->
    <div id="loginBox" class="card">
      <h2>Log in</h2>
      <input id="loginUsername" placeholder="Username" />
      <input id="loginPassword" type="password" placeholder="Password" />
      <button onclick="login()">Log in</button>
      <button class="secondaryBtn" onclick="showRegister()">Not registered?</button>
    </div>

    <!-- REGISTER -->
    <div id="registerBox" class="card hidden">
      <h2>Create account</h2>
      <input id="registerUsername" placeholder="Username" />
      <input id="registerEmail" type="email" placeholder="Email" />
      <input id="registerPassword" type="password" placeholder="Password" />
      <button onclick="register()">Create account</button>
      <button class="secondaryBtn" onclick="showLogin()">Back to log in</button>
    </div>
  </div>

  <!-- APP -->
  <div id="app">

    <!-- SIDEBAR -->
    <div id="sidebar">
      <div class="sidebarTop">
        <p id="welcomeUser" class="welcomeLabel"></p>
        <button class="logoutBtn" onclick="logout()">Log out</button>
      </div>

      <nav class="menu">
        <!-- USERS -->
        <div class="menuItem" onclick="toggleDropdown('usersDropdown')">
          <span class="menuIcon">&#128101;</span>
          <span class="menuLabel">Family</span>
          <div id="usersDropdown" class="dropdownContent" onclick="event.stopPropagation()">
            <div id="usersList"></div>
          </div>
        </div>

        <!-- REQUESTS -->
        <div class="menuItem" onclick="toggleDropdown('requestsDropdown')">
          <span class="menuIcon">&#128276;</span>
          <span class="menuLabel">Requests</span>
          <div id="requestsDropdown" class="dropdownContent" onclick="event.stopPropagation()">
            <div id="notificationsList"></div>
          </div>
        </div>

        <!-- TASKS -->
        <div class="menuItem" onclick="toggleDropdown('tasksDropdown')">
          <span class="menuIcon">&#128221;</span>
          <span class="menuLabel">Add task</span>
          <div id="tasksDropdown" onclick="event.stopPropagation()" class="dropdownContent">
            <input id="taskInput" placeholder="New task" />
            <button onclick="addTask()">Add task</button>
          </div>
        </div>

        <!-- SHARED COUNTERS -->
        <div class="menuItem" onclick="toggleDropdown('countersDropdown')">
          <span class="menuIcon">&#128279;</span>
          <span class="menuLabel">Shared counters</span>
          <div id="countersDropdown" class="dropdownContent" onclick="event.stopPropagation()">
            <div id="sharedCountersList"></div>
          </div>
        </div>
      </nav>
    </div>

    <!-- MAIN -->
    <div id="mainContent">

      <div class="statsStrip" id="statsStripHeader">
        <p class="eyebrow">Today</p>
        <h1>Daily stats</h1>
      </div>

      <div id="statsList" class="statsGrid"></div>

      <div class="sectionHead">
        <p class="eyebrow">Tasks</p>
      </div>
      <div id="taskList" class="taskGrid"></div>
    </div>
  </div>

  <!-- CHAT -->
  <div id="chatToggle" aria-label="Open family chat">&#128172;</div>

  <div id="chatWindow">
    <div class="chatHeader">
      <span>Family chat</span>
      <span id="closeChat" class="chatClose">&#10005;</span>
    </div>

    <div id="chatMessages"></div>

    <div class="chatInputRow">
      <input id="chatInput" placeholder="Write a message..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    function showRegister() {
      document.getElementById("loginBox").classList.add("hidden");
      document.getElementById("registerBox").classList.remove("hidden");
    }

    function showLogin() {
      document.getElementById("registerBox").classList.add("hidden");
      document.getElementById("loginBox").classList.remove("hidden");
    }

    function toggleDropdown(id) {
      const element = document.getElementById(id);
      const isOpen = element.style.display === "block";
      document.querySelectorAll(".dropdownContent").forEach((el) => (el.style.display = "none"));
      element.style.display = isOpen ? "none" : "block";
    }

    document.addEventListener("DOMContentLoaded", function () {
      const chatToggle = document.getElementById("chatToggle");
      const chatWindow = document.getElementById("chatWindow");
      const closeChat = document.getElementById("closeChat");

      chatToggle.addEventListener("click", function () {
        chatWindow.style.display = chatWindow.style.display === "flex" ? "none" : "flex";
      });

      closeChat.addEventListener("click", function () {
        chatWindow.style.display = "none";
      });
    });
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    window.API_BASE = "/api";
  </script>

  <!-- JS -->
  <script type="module" src="./js/auth.js"></script>
  <script type="module" src="./js/profiles.js"></script>
  <script type="module" src="./js/requests.js"></script>
  <script type="module" src="./js/tasks.js"></script>
  <script type="module" src="./js/chat.js"></script>
  <script type="module" src="./js/counters.js"></script>
  <script type="module" src="./js/ui.js"></script>

</body>
</html>
