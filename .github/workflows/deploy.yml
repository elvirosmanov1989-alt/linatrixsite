name: Deploy to Node3

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy application
        run: |
          cd /home/linatrixsite
          git pull
          docker-compose down
          docker-compose up -d --build