apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        {{- if .Values.vault.enabled }}
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "family-task-app"
        vault.hashicorp.com/agent-inject-secret-config: "secret/data/family-task-app"
        vault.hashicorp.com/agent-inject-template-config: |
          {{`{{- with secret "secret/data/family-task-app" -}}`}}
          export DB_PASSWORD="{{`{{ .Data.data.dbPassword }}`}}"
          export JWT_SECRET="{{`{{ .Data.data.jwtSecret }}`}}"
          {{`{{- end -}}`}}
        {{- end }}
    spec:
      serviceAccountName: family-task-app-sa
      imagePullSecrets:
        - name: gitlab-registry-cred
      containers:
        - name: backend
          image: {{ .Values.backend.image }}
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              {{- if .Values.vault.enabled }}
              source /vault/secrets/config
              {{- end }}
              exec node server.js
          ports:
            - containerPort: {{ .Values.backend.port }}
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: family-task-config
                  key: PORT
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: family-task-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: family-task-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: family-task-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: family-task-secrets
                  key: DB_USER
            {{- if not .Values.vault.enabled }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: family-task-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: family-task-secrets
                  key: JWT_SECRET
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: {{ .Values.backend.resources.requests.cpu | quote }}
              memory: {{ .Values.backend.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.backend.resources.limits.cpu | quote }}
              memory: {{ .Values.backend.resources.limits.memory | quote }}
