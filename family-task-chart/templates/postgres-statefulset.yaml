apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: {{ .Values.namespace }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "family-task-app"
        vault.hashicorp.com/agent-inject-secret-pg-config: "secret/data/family-task-app"
        vault.hashicorp.com/agent-inject-template-pg-config: |
          {{`{{- with secret "secret/data/family-task-app" -}}`}}
          export POSTGRES_PASSWORD="{{`{{ .Data.data.dbPassword }}`}}"
          {{`{{- end -}}`}}
    spec:
      serviceAccountName: family-task-app-sa
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          command: ["/bin/sh", "-c"]
          args:
            - source /vault/secrets/pg-config && exec docker-entrypoint.sh postgres
          ports:
            - containerPort: {{ .Values.postgres.port }}
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: family-task-secrets
                  key: DB_USER
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: family-task-config
                  key: DB_NAME
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
              subPath: postgres
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 15
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.postgres.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.postgres.storageSize }}
