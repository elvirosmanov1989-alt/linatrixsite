namespace: family-task-app

frontend:
  image: linatrixsite-frontend:latest
  replicas: 2
  port: 80
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"

backend:
  image: linatrixsite-backend:latest
  replicas: 1
  port: 3000
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

postgres:
  image: postgres:16-alpine
  port: 5432
  storageSize: 1Gi
  storageClassName: local-path

config:
  dbHost: "postgres"
  dbPort: "5432"
  dbName: "family_task_app"
  backendPort: "3000"

secrets:
  dbUser: "postgres"
  dbPassword: "CHANGE_ME"
  jwtSecret: "CHANGE_ME_LONG_RANDOM_STRING"

ingress:
  host: linatrixsite.local
  className: nginx

nodeSelector:
  hostname: node1
